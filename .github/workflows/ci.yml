name: CI — Monorepo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The pnpm action gets no 'version' — it reads the packageManager field from
# package.json, which is what keeps CI and local machines on the same version.

# No build job: Cloudflare Pages builds the smallwebapps project on every push
# and reports it as a check. A build here would repeat exactly what the host
# already does.

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # apps/web is the only workspace with a typecheck, and it is astro check.
      - name: Check apps/web
        run: pnpm run check

  # apps/web is the only workspace, so the suite is called by its own path
  # rather than through a root script that would only ever forward to it.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Test apps/web
        run: pnpm --dir apps/web test --run

