name: CI — Monorepo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The pnpm action gets no 'version' — it reads the packageManager field from
# package.json, which is what keeps CI and local machines on the same version.

# No build job: Cloudflare Pages builds BOTH apps (smallwebapps and tubetrace)
# on every push and reports each one as a check. A build here covered only
# apps/web — a subset of what the host already does.

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # apps/web uses astro check; apps/tubetrace uses tsc. There is no script
      # common to both, so each is called by the name it actually has.
      - name: Check apps/web
        run: pnpm run check
      - name: Typecheck apps/tubetrace
        run: pnpm run typecheck:tubetrace

