name: CI — Monorepo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A action de pnpm não recebe 'version' — ela lê o campo packageManager do
# package.json, que é o que mantém o CI e as máquinas locais na mesma versão.

# Sem job de build: o Cloudflare Pages constrói os DOIS apps (smallwebapps e
# tubetrace) a cada push e reporta cada um como check. O build daqui cobria só
# apps/web — era subconjunto do que o host já faz.

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # apps/web usa astro check; apps/tubetrace usa tsc. Não há um script
      # comum aos dois, então cada um é chamado pelo nome que realmente tem.
      - name: Check apps/web
        run: pnpm run check
      - name: Typecheck apps/tubetrace
        run: pnpm run typecheck:tubetrace

